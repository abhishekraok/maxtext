# olmo35-cp-ep: olmo35-ep-as-cp with a 'context' mesh axis beside 'expert', for slices bigger than 128 chips at
# the same 16-sequence batch. Outside the dMoE one sequence spans context x expert chips (CP 32 on an 8x8x8); inside
# it the experts shard over both axes (EP 32, as cp-as-ep). KDA's recurrence needs the whole sequence: its heads shard
# over 'expert' and its value dimension, independent in the chunked recurrence, over 'context'.
mesh_axes: ['data', 'stage', 'fsdp', 'context', 'expert']
data_sharding: [['data', 'stage', 'fsdp', 'context', 'expert']]
logical_axis_rules: [
                      # ==========================================
                      # Vocabulary Embedding
                      # ==========================================
                      # Vocab Activations
                      ['activation_embed_and_logits_batch', ['data', 'stage', 'fsdp']],
                      ['activation_embed_and_logits_batch_sequence', ['data', 'stage', 'fsdp', 'context', 'expert']],
                      # Vocab Weights
                      ['vocab', []],
                      ['embed_vocab', ['fsdp', 'context', 'expert']],
                      # ==========================================
                      # Attention
                      # ==========================================
                      # Attention Activations
                      ['activation_batch_attn', ['data', 'fsdp']],
                      ['activation_heads', []],
                      ['activation_kda_heads', ['expert']],
                      ['activation_kda_value', ['context']],
                      ['activation_kv_heads', []],
                      ['activation_length_attn', ['context', 'expert']],
                      ['activation_q_length', ['context', 'expert']],
                      ['activation_kv_length', []],
                      ['activation_embed_attn', []],
                      ['activation_kv', []],
                      ['activation_kv_batch', ['data', 'fsdp']],
                      ['activation_kv_head_dim', []],
                      # Attention Weights
                      ['heads', []],
                      ['q_heads', []],
                      ['kv_heads', []],
                      ['qkv', []],
                      ['kv', []],
                      ['kv_head_dim', []],
                      ['q_lora', ['fsdp']],
                      ["q_lora_up_proj", []],
                      ['kv_lora', ['fsdp']],
                      ["kv_lora_up_proj", []],
                      # ==========================================
                      # Mixture of Experts (MoE)
                      # ==========================================
                      # MoE Activations
                      ['activation_batch_moe', ['data', 'fsdp']],
                      ['activation_exp', ['context', 'expert']],
                      # MoE Weights
                      ['exp', ['context', 'expert']],
                      ['embed_moe', ['fsdp']],
                      # ==========================================
                      # Standard MLP / Dense Layers / Model Structure
                      # ==========================================
                      # Dense Activations
                      ['activation_mlp', []],
                      ['activation_batch', ['data', 'fsdp']],
                      ['activation_length', ['context', 'expert']],
                      ['activation_norm_length', ['context', 'expert']],
                      ['activation_embed', []],
                      ['activation_stage', 'stage'],
                      # General Weights
                      ['mlp', []],
                      ['layers', 'stage'],
                      ['embed', ['fsdp', 'context', 'expert']],
                      ['embed_attn', ['fsdp', 'context', 'expert']],
                  ]
