# OLMo 3.5 Small + vision (olmo35-small-e256k8-sh2x, "A4B": 40L 7:1 KDA:FA, 256 experts top-8, 4.12B active /
# 72.6B total; SigLIP2 25L + 2x2 attention pooling + SwiGLU connector) multimodal SFT at 64K on a v4 8x8x8
# (512 chips, 128 hosts): 16 x 65,536 tokens a step, 8,076 steps (the Small ablation, ledger issue #1608).
#
# It combines
#   - the model, vision tower/connector, scanned stack and EMo causal pools of the Small multimodal mid-training
#     (olmo35_small_midtrain_256k.yml + olmo-gcp-infra calebo/hero-256k-config midtrain-small-256k), so the
#     mid-training checkpoint (decoder.layers_0.layer_N + decoder.scanned_blocks, vision kept) loads as is
#     with load_parameters_path, no conversion;
#   - the multimodal SFT trainer of olmo35_tiny_mm_sft_64k.yml (dataset_type=olmo_mm trained-row loading, one token-
#     weighted CE over loss weights, router losses over loss tokens, per-group clipping, LOSS-PARTS);
#   - the text team's 16-row Small SFT recipe on the 512-chip slice (ledger H267 / H251 layout; flags of
#     experiments/h269/h262-3k/env.json): data4 x FSDP4 x EP32 on olmo35-ep-as-cp, context_parallel_load_balance
#     false, ragged buffer factor 14 with REQUIRED_RBF / MOE-DROPPED logging, the Small kernel tiles, AdamW 0.9 / 0.95
#     / 1e-8, wd 0, clip 1.0, z-loss 1e-5, load balancing 0.01 (sum, global), 3% warmup then linear to 0.
#
# Choices to know:
#   - scan_layers=true (as mid-training; the text recipe runs false on an unstacked copy).
#   - EMo on, causal, with mid-training's r3 pools: 32 / 64 / 256 of 256 at 1/8, 1/8, 3/4, threshold by bisection,
#     eval pool 256. These are also the 3K text hero's causal flags (h262-3k env.json). The 16-row text runs so
#     far ran EMo off; the Tiny SFT used uniform [16, 512] (OLMo-core's draw). Both arms of the ablation use this.
#   - LR: LM 7.3e-5 (the hero's 1.8e-4 at 96 rows x sqrt(16/96)); connector 2x and ViT 0.1x of LM, the ratios of the
#     Tiny SFT (OLMo-core olmo35_mm_sft: 2e-4 / 4e-4 / 2e-5). Mid-training ran the ViT at 0.3385x (Run 9's absolute
#     4.4e-5 held); not carried over to SFT.
#   - Images off (the ablation's other arm): the same config plus olmo_mm_keep_sources=[<text source name(s)>],
#     which trains only those sources of the same OLMo-core data config. Nothing else changes.
#   - <think>/</think> rows: if the base did not train ids 100256 / 100266, pass
#     olmo_seed_token_rows=[[100256,14023,771,29],[100266,524,27963,29]] (applied at step 0 only, never on resume).
#
# Launch (every host; open-instruct scripts/tpu/maxtext/k8s/olmo35-small-mm-sft-8x8x8):
#   python3 -m maxtext.trainers.pre_train.train src/maxtext/configs/olmo/olmo35_small_mm_sft_64k.yml \
#     run_name=... base_output_directory=gs://... load_parameters_path=gs://.../checkpoints/<step>/items \
#     olmo_mm_config_path=/weka/.../config.json
# env: OLMO_MM_LOADER_WORLD=16 (one OLMo-core loader rank per trained row), OLMOE3_ENABLE_2STAGE_RS=0
#   OLMOE3_FAST_HOST_LOOP=1 OLMOE3_FAST_SC_DEVICE_PUT=1 TPU_MEGACORE=MEGACORE_DENSE.

base_config: "base.yml"
model_name: "olmo35-small-e256k8-sh2x"
override_model_config: true

# -------------- Data (OLMo-core MixtureDataLoader in-process, one loader rank per trained row) --------------
dataset_type: "olmo_mm"
olmo_mm_config_path: ""   # REQUIRED: the Small SFT data config (OLMo-core config.json: C16 text + image mixture)
olmo_mm_work_dir: "/tmp/olmo_mm_work"
olmo_mm_num_workers: 16
olmo_mm_keep_sources: []  # images-off arm: [<text source name(s) of the data config>]
olmo_use_loss_weights: true
olmo_reset_positions_on_segment: true  # NoPE model: positions do not reach the network
max_target_length: 65536
packing: true
eval_interval: -1
enable_data_shuffling: false

# -------------- Batch & mesh (H267 / H251: data4 x FSDP4 x EP32 on olmo35-ep-as-cp, 16 rows) --------------
per_device_batch_size: 0.03125   # 16 sequences on 512 chips
gradient_accumulation_steps: 1
custom_mesh_and_rule: "olmo35-ep-as-cp"
ici_data_parallelism: 4
ici_fsdp_parallelism: 4
ici_expert_parallelism: 32
context_parallel_load_balance: false
attention_local_load_balance: false
allow_split_physical_axes: true
shard_exp_on_fsdp: false
shard_optimizer_over_data: false
sharding_tolerance: 0.3

# -------------- Model numerics (mid-training and the text recipe) --------------
dtype: "bfloat16"
dtype_mm: "bfloat16"
weight_dtype: "float32"
mu_dtype: "float32"
cast_params_to_compute_dtype: true
float32_gate_logits: true
gdn_state_dtype: "float32"
olmoe3_segments_for_emo_only: false   # documents bound attention, KDA and EMo pools (OLMo-core document mode)
emo_enabled: true
emo_causal_pool: true
emo_threshold_by_bisection: true
emo_document_expert_pool_choices: [32, 64, 256]
emo_document_expert_pool_probs: [0.125, 0.125, 0.75]
emo_min_document_expert_pool: 8
emo_max_document_expert_pool: 256
emo_eval_document_expert_pool: 256
load_balance_loss_weight: 0.01
moe_aux_loss_reduction: "sum"
moe_global_load_balancing: true
z_loss_multiplier: 1.0e-5
olmo_router_loss_divisor: "loss_tokens"
static_loss_cotangent: true

# -------------- Scanned stack & rematerialization --------------
scan_layers: true                # the mid-training checkpoint's layout: layers_0 (dense prefix cycle) + scanned_blocks
olmoe3_per_layer_remat: true
remat_policy: "custom"           # as h262-3k env.json; fall back to remat_policy=full if a 64K image step does not fit
decoder_layer_input: "device"
moe_routing_maps: "device"
moe_routing: "device"
context: "device"
moe_combine: "device"

# -------------- Kernels (the Small text recipe, h262-3k env.json = olmo35_small_midtrain_256k.yml tiles) ---------
megablox: true
sparse_matmul: true
use_tokamax_gmm: false
use_gmm_v2: false
moe_fused_swiglu_gmm: true
moe_a2a_pipeline_chunks: false
moe_fused_swiglu_bwd_tile_batch_seq: 256
moe_fused_swiglu_bwd_tile_embed_dim: 768
moe_fused_swiglu_bwd_tile_mlp_dim: 768
moe_fused_swiglu_dwo_tile_embed_dim: 768
moe_fused_swiglu_dwo_tile_mlp_dim: 768
wi_tile_fwd_batch_seq: 512
wi_tile_fwd_embed_dim: 768
wi_tile_fwd_mlp_dim: 768
wi_tile_dlhs_batch_seq: 512
wi_tile_dlhs_embed_dim: 384
wi_tile_dlhs_mlp_dim: 1536
wi_tile_drhs_batch_seq: 512
wi_tile_drhs_embed_dim: 768
wi_tile_drhs_mlp_dim: 768
wo_tile_fwd_batch_seq: 512
wo_tile_fwd_embed_dim: 384
wo_tile_fwd_mlp_dim: 1536
wo_tile_dlhs_batch_seq: 512
wo_tile_dlhs_embed_dim: 768
wo_tile_dlhs_mlp_dim: 768
wo_tile_drhs_batch_seq: 512
wo_tile_drhs_embed_dim: 384
wo_tile_drhs_mlp_dim: 768
capacity_factor: -1
moe_lean_routing: true
moe_topk_pallas: false
moe_a2a_expert_major: true
moe_a2a_token_chunks: 2
ragged_buffer_factor: 14.0       # the 16-row text recipe's buffer; REQUIRED_RBF says what would have dropped nothing
log_required_ragged_buffer_factor: true
log_moe_dropped_tokens: true

use_tokamax_kda: false
kda_chunked_impl: "subblock"
kda_sub_block: 16
gdn_chunk_size: 128
kda_pallas_fused: true
kda_fused_token_major: true
kda_outer_block: 32
kda_inverse_precision: "high"
kda_fused_input_proj: true
kda_flat_head_layout: true
kda_fused_state_stride: 0

attention: "flash"
use_tokamax_splash: false

fused_lm_head_ce: true
fused_lm_head_ce_block_t: 512
fused_lm_head_ce_block_v: 1024
fused_lm_head_ce_block_t_bwd: 512
fused_lm_head_ce_block_v_bwd: 128
logits_dot_in_fp32: false
vocab_tiling_seq_major: true
num_vocab_tiling: 8

# -------------- Vision tower & connector (all trained) --------------
use_multimodal: true
vision_encoder_block: "olmo35"
freeze_vision_encoder_params: false
frozen_parameters_mask: []
olmo_max_crops_per_seq: 512          # must equal the data config's data_loader.pack_max_crops at 64K
olmo_max_pooled_patches_per_seq: 65536
olmo_vit_cp_shard_crops: true
olmo_vit_remat_blocks: true
olmo_vit_crop_chunk_size: 16
olmo_vit_balance_crops: true         # crops spread over all devices, unused chunks skipped (Tiny SFT: 16.9 -> 10.3 s)
olmo_mm_prefetch_batches: 1          # next batch built on a background thread (same batches, same order)
olmo_mm_batch_hash_steps: 20         # MM-BATCH-HASH lines for steps 1-20 of every loader rank (the batch gate)

# -------------- Optimizer & schedule --------------
opt_type: "adamw"
learning_rate: 7.3e-5
olmo_vision_lr_scale: 0.1       # ViT 7.3e-6
olmo_connector_lr_scale: 2.0    # connector 1.46e-4
olmo_embedding_lr_scale: 1.0
olmo_vision_lr_cosine_alpha_f: -1.0  # every group on the LM's schedule
lr_schedule_type: "wsd"
wsd_decay_style: "linear"
steps: 8076
learning_rate_schedule_steps: 8076
warmup_step_offset: 1
warmup_steps_fraction: 0.02996532937097573   # 242 / 8076: int(8076 * f) = 242 = int(8076 * 0.03)
wsd_decay_steps_fraction: 0.9700346706290243  # 1 - the above: int(8076 * f) = 7834, no stable phase
learning_rate_final_fraction: 0.0
adam_b1: 0.9
adam_b2: 0.95
adam_eps: 1.0e-8
adam_weight_decay: 0.0
gradient_clipping_threshold: 1.0
olmo_per_component_grad_clip: true
olmo_clip_embeddings_with_lm: true
skip_step_on_spikes: true
skip_step_interval: 128
skip_step_scaling_factor: 6.0
olmo_seed_token_rows: []        # see the header: set only if the base did not train 100256 / 100266

# -------------- Checkpointing & logging --------------
enable_checkpointing: true
checkpoint_period: 1000              # ~0.8 TB a save with optimizer state; 8 saves for the run
max_num_checkpoints_to_keep: 30   # keep every save of the 8,076-step run (deletions stall the slice; H269)
async_checkpointing: false
log_loss_parts: true
