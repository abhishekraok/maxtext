# OLMo 3.5 tiny + vision (olmoe3-810m-cx2: 16L KDA/gated-FA, 512 experts top-16, EMo causal; SigLIP2 25L + connector)
# multimodal SFT at 64K on a v4 4x4x8 slice (128 chips, 32 hosts), reproducing the OLMo-core recipe
# olmo_core.internal.olmo35_mm_sft (OLMo-core fd9bba1ba) run as
#   Olmo35-Multimodal-SFT.py train olmo35-mmsft-4n-emo256k ai2/holmes --recipe.base=256k-emo-causal \
#     --recipe.save_fraction=0.5 --recipe.ephemeral_save_interval=250 --recipe.num_nodes=4 ...
# (GPU arm H231 "emo256k"): 32 x 65,536 tokens per step, 10,962 steps, data seed 34521.
#
# Data: the recipe's own OLMo-core data config (olmo/olmo_mm/olmo35_mmsft_4n_emo256k_config.json, rebuilt with
#   build_config from the recipe with the GPU run's arguments): text = C12 numpy SFT cache + h182 replay packed to 64K
#   with document boundaries from the cache metadata, images = stage2_v1 mixture, label masks = assistant tokens
#   (image sources carry fractional per-token loss weights). Every host that holds trained rows runs OLMo-core's
#   MixtureDataLoader in-process for the GPU ranks of those rows (OLMO_MM_LOADER_WORLD, default 32 = one rank per row,
#   as the 32-GPU run), so the steps see the GPU run's batches. The /weka paths resolve through the gcsfuse mirror.
# Loss: one token-weighted CE over the label-mask weights (no image loss share), z-loss 1e-5, router losses (lb 0.01 +
#   router z 1e-5) divided by the loss weight sum (router_loss_divisor="loss_tokens").
# Optimizer: AdamW (0.9, 0.95, 1e-8), wd 0, LM lr 2e-4, connector 4e-4, ViT 2e-5 on one schedule (linear warmup 328
#   steps = int(3% of 10,962), then linear to 0 at step 10,962, counted from 1 as OLMo-core), nothing frozen,
#   gradient clipping 1.0 per OLMo-core scheduler group (connector / vision / everything else incl. embeddings),
#   OLMo-core skip-step (128 steps, 6 sigma), fresh optimizer state.
# Init: the converted B2e checkpoint (load_parameters_path); <think>/</think> rows seeded at step 0 (fresh runs only).
#
# Launch (every host):
#   python3 -m maxtext.trainers.pre_train.train src/maxtext/configs/olmo/olmo35_tiny_mm_sft_64k.yml \
#     run_name=... base_output_directory=gs://... load_parameters_path=gs://.../0/items
# env: OLMO_MM_LOADER_WORLD=32 (the default for this config anyway).

base_config: "base.yml"
model_name: "olmo35-tiny"
override_model_config: true

# -------------- Data (OLMo-core MixtureDataLoader in-process) --------------
dataset_type: "olmo_mm"
olmo_mm_config_path: "olmo/olmo_mm/olmo35_mmsft_4n_emo256k_config.json"  # resolved under maxtext/configs
olmo_mm_work_dir: "/tmp/olmo_mm_work"
olmo_mm_num_workers: 16
olmo_use_loss_weights: true
olmo_reset_positions_on_segment: true  # NoPE model: positions do not reach the network
max_target_length: 65536
packing: true
eval_interval: -1
enable_data_shuffling: false

# -------------- Batch & mesh (text SFT 64K recipe: olmo35-ep-as-cp, FSDP 16 x EP/CP 8) --------------
per_device_batch_size: 0.125   # 16 sequences per micro-batch
gradient_accumulation_steps: 2  # 32 sequences x 65,536 tokens per step
custom_mesh_and_rule: "olmo35-ep-as-cp"
ici_data_parallelism: 1
ici_fsdp_parallelism: 16
ici_expert_parallelism: 8
context_parallel_load_balance: false
allow_split_physical_axes: true
shard_exp_on_fsdp: false
sharding_tolerance: 0.3

# -------------- Model numerics --------------
dtype: "bfloat16"
dtype_mm: "bfloat16"
weight_dtype: "float32"
mu_dtype: "float32"
float32_gate_logits: true
gdn_state_dtype: "float32"
olmoe3_segments_for_emo_only: false   # documents bound attention, KDA and EMo pools (OLMo-core document mode)
emo_enabled: true
emo_causal_pool: true
emo_min_document_expert_pool: 16
emo_max_document_expert_pool: 512
emo_eval_document_expert_pool: 512
load_balance_loss_weight: 0.01
moe_aux_loss_reduction: "sum"
moe_global_load_balancing: true
z_loss_multiplier: 1.0e-5
olmo_router_loss_divisor: "loss_tokens"
static_loss_cotangent: true

# -------------- Kernels & memory (as the text SFT 64K recipe) --------------
scan_layers: true
olmoe3_per_layer_remat: true
remat_policy: "full"
sparse_matmul: true
megablox: true
use_tokamax_kda: false
kda_chunked_impl: "subblock"
kda_matmul_precision: "highest"
num_vocab_tiling: 16
ragged_buffer_factor: 2.5
log_required_ragged_buffer_factor: true

# -------------- Vision tower & connector --------------
use_multimodal: true
vision_encoder_block: "olmo35"
freeze_vision_encoder_params: false
frozen_parameters_mask: []
olmo_max_crops_per_seq: 512          # = the loader's pack_max_crops at 64K
olmo_max_pooled_patches_per_seq: 65536
olmo_vit_cp_shard_crops: true
olmo_vit_remat_blocks: true
olmo_vit_crop_chunk_size: 16

# -------------- Optimizer & schedule --------------
opt_type: "adamw"
learning_rate: 2.0e-4
olmo_vision_lr_scale: 0.1       # ViT 2e-5
olmo_connector_lr_scale: 2.0    # connector 4e-4
olmo_embedding_lr_scale: 1.0
olmo_vision_lr_cosine_alpha_f: -1.0  # every group on the LM's schedule
lr_schedule_type: "wsd"
wsd_decay_style: "linear"
steps: 10962
learning_rate_schedule_steps: 10962
warmup_step_offset: 1
warmup_steps_fraction: 0.029921547162926474   # 328 / 10962: int(10962 * f) = 328 = int(10962 * 0.03)
wsd_decay_steps_fraction: 0.9700784528370735  # 1 - the above: int(10962 * f) = 10634, no stable phase
learning_rate_final_fraction: 0.0
adam_b1: 0.9
adam_b2: 0.95
adam_eps: 1.0e-8
adam_weight_decay: 0.0
gradient_clipping_threshold: 1.0
olmo_per_component_grad_clip: true
olmo_clip_embeddings_with_lm: true
skip_step_on_spikes: true
skip_step_interval: 128
skip_step_scaling_factor: 6.0
olmo_seed_token_rows: [[100256, 14023, 771, 29], [100266, 524, 27963, 29]]

# -------------- Checkpointing & logging --------------
enable_checkpointing: true
checkpoint_period: 500
max_num_checkpoints_to_keep: 2
log_loss_parts: true
